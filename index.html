<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HOLLYWOOD IMAGING • KNOCKSSTUDiOS</title>
<meta name="description" content="Three engines. One studio.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="HOLLYWOOD IMAGING">
<meta property="og:description" content="NEBULA · SOUL · CHRONOS44 — KNOCKSSTUDiOS">
<meta property="og:image" content="/og/hub.png">
<link rel="icon" href="/icon.png">
<style>
  /* ── HDR-aware tokens (rec2100-hlg → SDR fallback) ─────── */
  :root {
    --bg:#000; --fg:#f4f4f6;
    --violet:#7C5CFF; --cyan:#00E5C7; --amber:#FFB347;
  }
  @media (dynamic-range: high) {
    :root {
      --violet: color(rec2100-hlg 1.2 0.4 2.0);
      --cyan:   color(rec2100-hlg 0.2 1.4 1.3);
      --amber:  color(rec2100-hlg 1.8 1.1 0.2);
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    overflow:hidden; touch-action:none; -webkit-font-smoothing:antialiased; }

  #stage { position:fixed; inset:0; z-index:0; display:block; }

  .ui { position:fixed; inset:0; z-index:10; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:max(32px,env(safe-area-inset-top)) 24px max(32px,env(safe-area-inset-bottom)); }
  .ui > * { pointer-events:auto; }

  .brand { font-size:12px; letter-spacing:0.32em; text-transform:uppercase;
    opacity:0.75; font-weight:500; }

  .hero { text-align:center; mix-blend-mode:plus-lighter; }
  .hero h1 { font-size:clamp(48px,9vw,128px); font-weight:800;
    letter-spacing:-0.04em; line-height:0.92;
    background:linear-gradient(135deg,var(--violet),var(--cyan) 55%,var(--amber));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 60px rgba(124,92,255,0.35)); }
  .hero p { margin-top:16px; font-size:clamp(13px,1.6vw,17px);
    opacity:0.65; letter-spacing:0.04em; }

  .apps { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:36px; }
  .chip { padding:11px 20px; border-radius:999px;
    background:rgba(255,255,255,0.04); backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.1); color:var(--fg);
    text-decoration:none; font-size:14px; font-weight:500;
    transition:transform .2s, border-color .2s, background .2s; }
  .chip:hover { transform:translateY(-2px); background:rgba(255,255,255,0.08); }
  .chip[data-app="nebula"]:hover  { border-color:var(--violet); }
  .chip[data-app="soul"]:hover    { border-color:var(--cyan); }
  .chip[data-app="chronos"]:hover { border-color:var(--amber); }

  .meta { display:flex; justify-content:space-between; align-items:flex-end;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.5; }
  .meta a { color:inherit; text-decoration:none; }
  .meta a:hover { opacity:1; }

  #gyroPrompt { position:fixed; bottom:84px; left:50%; transform:translateX(-50%);
    z-index:20; padding:12px 22px; border-radius:999px;
    background:rgba(255,255,255,0.08); backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15); color:var(--fg);
    font-size:13px; cursor:pointer; display:none; font-family:inherit; }
  #gyroPrompt.visible { display:block; }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="ui">
  <header class="brand">KNOCKSSTUDiOS</header>

  <main class="hero">
    <h1>HOLLYWOOD<br>IMAGING</h1>
    <p>Three engines. One studio.</p>
    <nav class="apps">
      <a class="chip" data-app="nebula"  href="https://nebula.hollywoodimaging.studio">NEBULA</a>
      <a class="chip" data-app="soul"    href="https://soul.hollywoodimaging.studio">SOUL · Q44</a>
      <a class="chip" data-app="chronos" href="https://chronos.hollywoodimaging.studio">CHRONOS44</a>
    </nav>
  </main>

  <footer class="meta">
    <span>v1.0 • SHIELD-signed</span>
    <a href="https://github.com/KNOCKSSTUDiOS" target="_blank" rel="noopener">@KNOCKSSTUDiOS</a>
  </footer>
</div>

<button id="gyroPrompt" type="button">Enable motion</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── KNOCKSSTUDiOS • HDR NODE FIELD • 10,000 NODES ───────────
const NODE_COUNT = 10000;
const canvas = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({
  canvas, antialias:true, alpha:false, powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 50;

// Build positions: 55% galactic disk + 45% spherical shell
const positions = new Float32Array(NODE_COUNT * 3);
const colors    = new Float32Array(NODE_COUNT * 3);
const sizes     = new Float32Array(NODE_COUNT);
const seeds     = new Float32Array(NODE_COUNT);

const cViolet = new THREE.Color(0x7C5CFF);
const cCyan   = new THREE.Color(0x00E5C7);
const cAmber  = new THREE.Color(0xFFB347);

for (let i = 0; i < NODE_COUNT; i++) {
  const i3 = i * 3;
  let x, y, z, r;
  if (Math.random() < 0.55) {
    r = 8 + Math.pow(Math.random(), 0.7) * 28;
    const th = Math.random() * Math.PI * 2;
    x = Math.cos(th) * r;
    z = Math.sin(th) * r;
    y = (Math.random() - 0.5) * 3 * (1 - r/40);
  } else {
    r = 12 + Math.pow(Math.random(), 0.5) * 24;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    x = r * Math.sin(ph) * Math.cos(th);
    y = r * Math.sin(ph) * Math.sin(th) * 0.6;
    z = r * Math.cos(ph);
  }
  positions[i3]=x; positions[i3+1]=y; positions[i3+2]=z;

  const t = Math.min(1, Math.hypot(x,y,z) / 36);
  const c = t < 0.5
    ? cViolet.clone().lerp(cCyan, t * 2)
    : cCyan.clone().lerp(cAmber, (t - 0.5) * 2);
  colors[i3]=c.r; colors[i3+1]=c.g; colors[i3+2]=c.b;

  sizes[i] = 0.5 + Math.random() * 1.8;
  seeds[i] = Math.random() * Math.PI * 2;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));
geo.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:       { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    attribute float size;
    attribute float seed;
    varying vec3  vColor;
    varying float vTwinkle;
    uniform float uTime;
    uniform float uPixelRatio;
    void main() {
      vColor = color;
      vTwinkle = 0.7 + 0.3 * sin(uTime * 2.0 + seed * 6.2831);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = size * uPixelRatio * (300.0 / -mv.z) * vTwinkle;
    }
  `,
  fragmentShader: `
    varying vec3  vColor;
    varying float vTwinkle;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float i = pow(smoothstep(0.5, 0.0, d), 1.6);
      // HDR emit: >1.0 so tonemap produces bloom-like glow
      vec3 hdr = vColor * (1.4 + 1.8 * i);
      gl_FragColor = vec4(hdr, i * vTwinkle);
    }
  `,
  transparent: true,
  depthWrite:  false,
  blending:    THREE.AdditiveBlending,
  vertexColors: true
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// ── INPUT: gyro (mobile) + pointer (desktop) ────────────────
const target  = { x: 0, y: 0 };
const current = { x: 0, y: 0 };
let usingGyro = false;

addEventListener('pointermove', (e) => {
  if (usingGyro) return;
  const nx = (e.clientX / innerWidth)  * 2 - 1;
  const ny = (e.clientY / innerHeight) * 2 - 1;
  target.x = ny * 0.5;
  target.y = nx * 0.8;
});

function handleOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  usingGyro = true;
  target.x = THREE.MathUtils.clamp(e.beta  / 90, -1, 1) * 0.5;
  target.y = THREE.MathUtils.clamp(e.gamma / 60, -1, 1) * 1.0;
}

const gyroPrompt = document.getElementById('gyroPrompt');
async function requestGyro() {
  if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
    try {
      const s = await DeviceOrientationEvent.requestPermission();
      if (s === 'granted') {
        addEventListener('deviceorientation', handleOrientation);
        gyroPrompt.classList.remove('visible');
      }
    } catch {}
  } else if ('DeviceOrientationEvent' in window) {
    addEventListener('deviceorientation', handleOrientation);
    gyroPrompt.classList.remove('visible');
  }
}
gyroPrompt.addEventListener('click', requestGyro);

if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
  gyroPrompt.classList.add('visible');   // iOS 13+ needs explicit tap
} else if (matchMedia('(pointer:coarse)').matches) {
  addEventListener('deviceorientation', handleOrientation);  // Android: auto
}

// ── ANIMATE ─────────────────────────────────────────────────
const clock = new THREE.Clock();
(function tick() {
  const t = clock.getElapsedTime();
  mat.uniforms.uTime.value = t;
  current.x += (target.x - current.x) * 0.05;
  current.y += (target.y - current.y) * 0.05;
  points.rotation.x = current.x + Math.sin(t * 0.10) * 0.15;
  points.rotation.y = current.y + t * 0.06;
  points.rotation.z = Math.cos(t * 0.07) * 0.05;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
})();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  mat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
});
</script>
</body>
</html>
